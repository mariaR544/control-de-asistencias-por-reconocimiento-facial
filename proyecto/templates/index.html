<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colegio Guayamurí - Panel de Asistencia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="logo-section">
                <h1>COLEGIO GUAYAMURÍ</h1>
                <p>Control de Asistencia-Empleados</p>
            </div>

            <nav class="nav-links">
    <a href="/" class="nav-btn active">📋 Monitor RRHH</a>
    <a href="/registro" class="nav-btn">👤 Registrar Personal</a>
    <a href="/iniciar-camara" class="nav-btn">📷 Iniciar Cámara Asistencia</a>
</nav>
        </div>

        <div>
            <a href="/descargar-excel" class="btn-excel">📊 Descargar Excel</a>
        </div>
    </div>

    <div class="main-content">
        <header>
            <h2>Panel de Control en Tiempo Real</h2>
            <span class="badge-live">• Transmisión En Vivo</span>
        </header>

        <main class="table-container">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Empleado</th>
                            <th>Departamento</th>
                            <th>Hora</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-asistencia">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        function cargarAsistencia() {
            fetch('/api/asistencia')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('tabla-asistencia');
                    tbody.innerHTML = ''; 

                    if(data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #999;">No hay marcas registradas el día de hoy.</td></tr>`;
                        return;
                    }

                    data.forEach(fila => {
                        tbody.innerHTML += `
                            <tr>
                                <td style="font-weight: 600;">${fila.cedula}</td>
                                <td>${fila.empleado}</td>
                                <td><span class="badge-dept">${fila.departamento}</span></td>
                                <td class="font-mono">${fila.hora}</td>
                                <td style="font-weight: 600;">${fila.estado}</td>
                            </tr>
                        `;
                    });
                })
                .catch(error => console.error('Error cargando datos:', error));
        }

        cargarAsistencia();
        setInterval(cargarAsistencia, 3000); // Recarga cada 3 segundos
    </script>
</body>
</html>
