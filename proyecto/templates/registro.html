<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guayamurí - Registrar Personal</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="logo-section">
                <h1>GUAYAMURÍ</h1>
                <p>Control de Asistencia Biométrico</p>
            </div>
            <nav class="nav-links">
                <a href="/" class="nav-btn">📋 Monitor RRHH</a>
                <a href="/registro" class="nav-btn active">👤 Registrar Personal</a>
                <a href="/iniciar-camara" class="nav-btn">📷 Iniciar Cámara Asistencia</a>
            </nav>
        </div>
        <div>
            <a href="/descargar-excel" class="btn-excel">📊 Descargar Excel</a>
        </div>
    </div>

    <div class="main-content">
        <header>
            <h2>Ingreso de Nuevo Personal al Sistema</h2>
        </header>

        <main class="table-container">
            <div class="form-box">
                <form action="/procesar-registro" method="POST">
                    
                    <div class="form-group">
                        <label for="cedula">Cédula de Identidad</label>
                        <input type="text" id="cedula" name="cedula" placeholder="Ej: V-12345678" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="nombre">Nombres</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Carlos" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="apellido">Apellidos</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez Rodríguez" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="departamento">Departamento / Área</label>
                        <select id="departamento" name="departamento" required>
                            <option value="GUAYAMURI/DOCENTE">Docente</option>
                            <option value="GUAYAMURI/ADMINISTRATIVO">Administrativo</option>
                            <option value="GUAYAMURI/MANTENIMIENTO">Mantenimiento</option>
                            <option value="GUAYAMURI/DIRECTIVO">Directivo</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-submit">📸 Capturar Rostro y Guardar</button>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
