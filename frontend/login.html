<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Colegio Guayamuri</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
    display: flex; 
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    
    /* Imagen de fondo con filtro oscuro integrado */
    background-image: 
        linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.8)), 
        url('img/img.jpeg'); 
    
    /* Propiedades para fijar y centrar la imagen */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
        }
        .login-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.25rem;
        }
        .login-logo img {
            max-width: 170px;
            max-height: 95px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.12));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .login-logo img:hover {
            transform: scale(1.04);
        }
        .login-title {
            text-align: center;
            color: var(--text-main);
            font-size: 1.35rem;
            margin-bottom: 2rem;
            font-weight: 700;
        }
        .login-btn {
            width: 100%;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            margin-top: 1rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 38, 142, 0.15);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 38, 142, 0.25);
        }
        .error-message {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            color: #b91c1c;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
}
        .form-control {
            border-radius: 12px;
            padding: 0.85rem 1.1rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .form-control:focus {
            background: #fff;
            border-color: var(--primary);
        }
        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2rem;
        }
    </style>
</head>
<body style="display: flex; min-height: 100vh;">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <img src="../imagenes/logo_guayamuri.png" alt="Logo Colegio Guayamuri">
            </div>
            <div class="login-title">Control de Asistencias</div>
            
            <div id="error-box" class="error-message"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" class="form-control" placeholder="Ingresa tu usuario" required autocomplete="username">
                </div>
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn login-btn" id="submit-btn">
                    <span>🔑 Entrar al Sistema</span>
                </button>
            </form>
            
            <div class="footer-text">
                &copy; 2026 Todos los derechos reservados.
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "http://localhost:8000";
        const form = document.getElementById("login-form");
        const errorBox = document.getElementById("error-box");
        const submitBtn = document.getElementById("submit-btn");

        // Si ya hay sesión iniciada, enviar directamente a la pantalla principal
        if (localStorage.getItem("token")) {
            window.location.href = "index.html";
        }   
form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            // Ocultar errores anteriores
            errorBox.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.querySelector("span").innerText = "Verificando...";

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            try {
                //Coma en el $
                const response = await fetch(`${BACKEND_URL}/api/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Guardar datos en LocalStorage
                    localStorage.setItem("token", data.access_token);
                    localStorage.setItem("username", data.username);
                    localStorage.setItem("name", data.name || "Administrador");
                    localStorage.setItem("role", data.role);
                    
                    // Redirigir
                    window.location.href = "index.html";
                } else {
                    // Mostrar error
                    showError(data.detail || "Error al iniciar sesión. Verifica tus credenciales.");
                }
            } catch (err) {
                console.error(err);
                showError("No se pudo conectar con el servidor. Verifica que el backend esté ejecutándose.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector("span").innerText = "🔑 Entrar al Sistema";
            }
        });

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.style.display = "block";
            // Reiniciar animación de shake
            errorBox.style.animation = 'none';
            errorBox.offsetHeight; // trigger reflow
            errorBox.style.animation = null;
        }
    </script>
</body>
</html>
